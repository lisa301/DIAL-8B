name: edge-pipeline-verify-once
on:
  push:
    branches:
      - edge-pipeline
    paths:
      - ".github/verify-edge-pipeline"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        run: cargo check -p dial-core
      - name: Focused SPM tests
        run: cargo test -p dial-core spm:: -- --nocapture
